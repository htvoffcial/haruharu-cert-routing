[package]
name = "hcrt"
version = "1.0.0"
edition = "2021"
description = "Haruharu Cert Routing (HCRT) v1 - Rust port of hcrt.py. Hand-written TLS 1.3 server that switches certificates by URL path."

# TLS (records / handshake / key schedule / tickets / ChronoCert rewind) is
# implemented by hand in src/main.rs, mirroring hcrt.py. Crates are used only
# for cryptographic primitives, the same role the `cryptography` package
# plays in the Python version.
[dependencies]
aes-gcm = "0.10"
x25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"

[profile.release]
